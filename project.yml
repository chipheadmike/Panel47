name: Panel47
options:
  bundleIdPrefix: com.chataeubacon.app
  deploymentTarget:
    macOS: "27.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 5TE942STS9
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
targets:
  Panel47:
    type: application
    platform: macOS
    sources:
      - path: Panel47
        excludes:
          - "Fonts/**"
      - path: Panel47/Fonts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chataeubacon.app.Panel47
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
    info:
      path: Panel47/Info.plist
      properties:
        ATSApplicationFontsPath: Fonts
    dependencies:
      - package: SwiftTerm

  Panel47Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Panel47Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chataeubacon.app.Panel47Tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Panel47

  Panel47UITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Panel47UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chataeubacon.app.Panel47UITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Panel47
    dependencies:
      - target: Panel47

schemes:
  Panel47:
    build:
      targets:
        Panel47: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - Panel47Tests
        - Panel47UITests
    archive:
      config: Release
